<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ゲーム / Games — エールお助け隊</title>
<link rel="icon" href="images/logo.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <a href="index.html" class="site-brand">
    <img src="images/logo.svg" class="site-logo" alt="" />
    <span class="site-brand-text">エールお助け隊</span>
  </a>
  <nav class="site-nav">
    <a href="index.html" class="nav-link" data-page="home"  data-nav="home">ホーム</a>
    <a href="daily.html" class="nav-link" data-page="daily" data-nav="daily">生活</a>
    <a href="games.html" class="nav-link" data-page="games" data-nav="games">ゲーム</a>
  </nav>
  <button class="site-lang-toggle" type="button">🌐 日本語</button>
</header>

<main class="page">
  <h1 id="pageTitle">🎮 ゲーム</h1>
  <p class="lead" id="pageLead">遊びながら日本での生活と日本語を学ぼう。</p>

  <section class="feature-grid">
    <a href="game.html" class="feature-card" id="gomiCard">
      <div class="feature-icon">🗑️</div>
      <h3 id="cardGameT">大阪市ごみ分別ゲーム</h3>
      <p  id="cardGameD">大阪市の分別ルールをゲームで学ぼう。100種類のごみを正しい箱に分けよう。</p>
    </a>
    <a href="kana.html" class="feature-card" id="kanaCard">
      <div class="feature-icon">📝</div>
      <h3 id="cardKanaT">かなクイズ</h3>
      <p  id="cardKanaD">ひらがな・カタカナを練習しよう。出題範囲を自由に選べます。</p>
    </a>
  </section>

  <!-- Per-game setup: mode + versus lobby options, expanded when a card
       is clicked. Same markup for both games; wired up in the script. -->
  <section class="game-setup hidden" id="gomiSetup" data-page="game.html">
    <div class="mode-row">
      <button class="btn mode-btn setup-single">ひとりで</button>
      <button class="btn btn-ghost mode-btn setup-versus">たいせん（2人）</button>
    </div>
    <div class="vs-setup hidden">
      <input class="vs-input vs-name" type="text" maxlength="16" placeholder="ユーザー名" autocomplete="off" />
      <button class="btn vs-create">ロビーを作成</button>
      <div class="vs-or"></div>
      <div class="vs-code-slots"></div>
      <div class="vs-keypad"></div>
      <button class="btn btn-ghost vs-join" disabled>参加</button>
    </div>
  </section>

  <section class="game-setup hidden" id="kanaSetup" data-page="kana.html">
    <div class="mode-row">
      <button class="btn mode-btn setup-single">ひとりで</button>
      <button class="btn btn-ghost mode-btn setup-versus">たいせん（2人）</button>
    </div>
    <div class="vs-setup hidden">
      <input class="vs-input vs-name" type="text" maxlength="16" placeholder="ユーザー名" autocomplete="off" />
      <button class="btn vs-create">ロビーを作成</button>
      <div class="vs-or"></div>
      <div class="vs-code-slots"></div>
      <div class="vs-keypad"></div>
      <button class="btn btn-ghost vs-join" disabled>参加</button>
    </div>
  </section>

</main>

<script src="common.js"></script>
<script>
(() => {
  'use strict';
  const I18N = {
    ja: { pageTitle:'🎮 ゲーム', pageLead:'遊びながら日本での生活と日本語を学ぼう。',
      cardGameT:'大阪市ごみ分別ゲーム', cardGameD:'大阪市の分別ルールをゲームで学ぼう。100種類のごみを正しい箱に分けよう。',
      cardKanaT:'かなクイズ', cardKanaD:'ひらがな・カタカナを練習しよう。出題範囲を自由に選べます。',
      setupSingleBtn:'ひとりで', setupVersusBtn:'たいせん（2人）', vsNamePh:'ユーザー名',
      vsCreateBtn:'ロビーを作成', vsOr:'または、絵の合言葉で参加', vsJoinBtn:'参加' },
    en: { pageTitle:'🎮 Games', pageLead:'Learn about life in Japan and Japanese while you play.',
      cardGameT:'Trash Sorting Game', cardGameD:'Learn Osaka’s sorting rules through play — 100 items, three bins.',
      cardKanaT:'Kana Quiz', cardKanaD:'Practice hiragana & katakana. Choose exactly what to drill.',
      setupSingleBtn:'Single', setupVersusBtn:'Versus (2P)', vsNamePh:'Username',
      vsCreateBtn:'Create lobby', vsOr:'or join with the picture code', vsJoinBtn:'Join' },
    zh: { pageTitle:'🎮 游戏', pageLead:'边玩边学日本生活与日语。',
      cardGameT:'大阪垃圾分类游戏', cardGameD:'通过游戏学习大阪的分类规则 —— 100 种垃圾，3 个垃圾桶。',
      cardKanaT:'假名测验', cardKanaD:'练习平假名和片假名，可自由选择测验范围。',
      setupSingleBtn:'单人', setupVersusBtn:'对战（2人）', vsNamePh:'用户名',
      vsCreateBtn:'创建房间', vsOr:'或用图片口令加入', vsJoinBtn:'加入' },
    ko: { pageTitle:'🎮 게임', pageLead:'놀면서 일본 생활과 일본어를 배워요.',
      cardGameT:'오사카 쓰레기 분리 게임', cardGameD:'게임으로 오사카의 분리수거 규칙을 배워보세요. 100가지 쓰레기, 3개의 통.',
      cardKanaT:'가나 퀴즈', cardKanaD:'히라가나·가타카나를 연습하세요. 출제 범위를 자유롭게 선택.',
      setupSingleBtn:'혼자', setupVersusBtn:'대전(2인)', vsNamePh:'사용자명',
      vsCreateBtn:'로비 만들기', vsOr:'또는 그림 코드로 참가', vsJoinBtn:'참가' },
    my: { pageTitle:'🎮 ဂိမ်းများ', pageLead:'ကစားရင်း ဂျပန်ဘဝနှင့် ဂျပန်စာ လေ့လာပါ။',
      cardGameT:'အိုဆာကာ အမှိုက်ခွဲခြားဂိမ်း', cardGameD:'ဂိမ်းဖြင့် ခွဲခြားရေးစည်းမျဉ်းကို လေ့လာပါ။ အမှိုက် ၁၀၀ မျိုး၊ အမှိုက်ပုံး ၃ ခု။',
      cardKanaT:'ကာနာ ပဟေဠိ', cardKanaD:'ဟိရဂန၊ ကတခန လေ့ကျင့်ပါ။ မေးခွန်းအပိုင်းအခြားကို လွတ်လပ်စွာ ရွေးပါ။',
      setupSingleBtn:'တစ်ဦးတည်း', setupVersusBtn:'ပြိုင်ပွဲ (၂ဦး)', vsNamePh:'အသုံးပြုသူအမည်',
      vsCreateBtn:'လော်ဘီဖန်တီးပါ', vsOr:'သို့မဟုတ် ပုံကုဒ်ဖြင့် ဝင်ပါ', vsJoinBtn:'ဝင်ရန်' },
    vi: { pageTitle:'🎮 Trò chơi', pageLead:'Vừa chơi vừa học về cuộc sống ở Nhật và tiếng Nhật.',
      cardGameT:'Trò chơi phân loại rác', cardGameD:'Học quy tắc phân loại của Osaka qua trò chơi — 100 món, 3 thùng.',
      cardKanaT:'Trắc nghiệm Kana', cardKanaD:'Luyện hiragana & katakana. Chọn chính xác phần muốn ôn.',
      setupSingleBtn:'Một mình', setupVersusBtn:'Đối kháng (2P)', vsNamePh:'Tên người dùng',
      vsCreateBtn:'Tạo phòng', vsOr:'hoặc tham gia bằng mã hình', vsJoinBtn:'Tham gia' },
  };
  function apply() {
    const L = I18N[getLang()] || I18N.ja;
    for (const k in L) { const el = document.getElementById(k); if (el) el.textContent = L[k]; }
    for (const panel of document.querySelectorAll('.game-setup')) {
      panel.querySelector('.setup-single').textContent = L.setupSingleBtn;
      panel.querySelector('.setup-versus').textContent = L.setupVersusBtn;
      panel.querySelector('.vs-name').placeholder = L.vsNamePh;
      panel.querySelector('.vs-create').textContent = L.vsCreateBtn;
      panel.querySelector('.vs-or').textContent = L.vsOr;
      panel.querySelector('.vs-join').textContent = L.vsJoinBtn;
    }
  }
  function refresh() { applySiteHeader('games'); apply(); }
  refresh();
  setupLangToggle(refresh);

  // ---- Per-game setup panels ----
  // Each game card toggles its panel; the panel launches the game page
  // with the chosen mode via URL params.
  const SETUPS = [
    { card: 'gomiCard', panel: 'gomiSetup', hash: 'gomi', singleUrl: 'game.html?mode=single', page: 'game.html' },
    { card: 'kanaCard', panel: 'kanaSetup', hash: 'kana', singleUrl: 'kana.html',             page: 'kana.html' },
  ];
  const panels = [];

  function wireSetup(cfg) {
    const card = document.getElementById(cfg.card);
    const panel = document.getElementById(cfg.panel);
    const q = (sel) => panel.querySelector(sel);
    const vsBox = q('.vs-setup');
    const joinBtn = q('.vs-join');

    let padCode = '';
    const pad = buildVsKeypad(q('.vs-keypad'), q('.vs-code-slots'), (code) => {
      padCode = code;
      joinBtn.disabled = code.length !== VS_CODE_LEN;
    });

    const openVersus = () => {
      vsBox.classList.remove('hidden');
      q('.setup-versus').classList.add('active');
    };
    const closeVersus = () => {
      vsBox.classList.add('hidden');
      q('.setup-versus').classList.remove('active');
      pad.reset();
    };
    const open = (withVersus) => {
      for (const p of panels) if (p !== api) p.close();   // one panel at a time
      panel.classList.remove('hidden');
      if (withVersus) openVersus();
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    const close = () => { panel.classList.add('hidden'); closeVersus(); };

    card.addEventListener('click', (e) => {
      e.preventDefault();
      if (panel.classList.contains('hidden')) open(false);
      else close();
    });
    q('.setup-single').addEventListener('click', () => { location.href = cfg.singleUrl; });
    q('.setup-versus').addEventListener('click', () => {
      if (vsBox.classList.contains('hidden')) openVersus();
      else closeVersus();
    });

    const getVsName = () => {
      const name = (q('.vs-name').value || '').trim().slice(0, 16);
      if (!name) { q('.vs-name').focus(); return null; }
      return name;
    };
    q('.vs-create').addEventListener('click', () => {
      const name = getVsName();
      if (name) location.href = cfg.page + '?vs=create&name=' + encodeURIComponent(name);
    });
    joinBtn.addEventListener('click', () => {
      const name = getVsName();
      if (name && padCode.length === VS_CODE_LEN) {
        location.href = cfg.page + '?vs=join&code=' + padCode + '&name=' + encodeURIComponent(name);
      }
    });

    const api = { open, close };
    panels.push(api);

    // the game pages send players back with #<game>-vs (lobby exit / rematch)
    if (location.hash === '#' + cfg.hash + '-vs') open(true);
    else if (location.hash === '#' + cfg.hash) open(false);
  }

  for (const cfg of SETUPS) wireSetup(cfg);
})();
</script>
</body>
</html>
