<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- takoyaki on a tray -->
  <g>
    <!-- tray -->
    <path d="M14 52 L86 52 L94 84 L6 84 Z" fill="#f5ead3" stroke="#c9a063" stroke-width="4" stroke-linejoin="round"/>
    <path d="M20 56 L80 56 L86 80 L14 80 Z" fill="#d9b380"/>
    <!-- skewer -->
    <rect x="63" y="6" width="5" height="30" rx="2.5" fill="#d9a52a" transform="rotate(8 65 21)"/>
    <!-- back row -->
    <circle cx="30" cy="46" r="15" fill="#6b3a1f"/>
    <circle cx="58" cy="44" r="15" fill="#6b3a1f"/>
    <circle cx="82" cy="47" r="13" fill="#6b3a1f"/>
    <!-- front row -->
    <circle cx="22" cy="64" r="15" fill="#7a4526"/>
    <circle cx="51" cy="64" r="16" fill="#7a4526"/>
    <circle cx="79" cy="64" r="14" fill="#7a4526"/>
    <!-- mayo / katsuobushi flakes -->
    <g fill="#f3ddb0">
      <ellipse cx="25" cy="42" rx="5" ry="3.4"/><ellipse cx="34" cy="49" rx="4" ry="2.8"/>
      <ellipse cx="54" cy="40" rx="5" ry="3.2"/><ellipse cx="62" cy="47" rx="4" ry="2.6"/>
      <ellipse cx="80" cy="43" rx="4.4" ry="3"/>
      <ellipse cx="18" cy="61" rx="4.6" ry="3.2"/><ellipse cx="27" cy="68" rx="4" ry="2.6"/>
      <ellipse cx="47" cy="60" rx="5" ry="3.4"/><ellipse cx="56" cy="68" rx="4.2" ry="2.8"/>
      <ellipse cx="76" cy="60" rx="4.4" ry="3"/><ellipse cx="83" cy="68" rx="3.6" ry="2.4"/>
    </g>
    <!-- aonori -->
    <g fill="#5d8a3c">
      <circle cx="31" cy="45" r="1.6"/><circle cx="59" cy="43" r="1.6"/><circle cx="85" cy="50" r="1.4"/>
      <circle cx="23" cy="66" r="1.6"/><circle cx="52" cy="63" r="1.6"/><circle cx="80" cy="66" r="1.4"/>
      <circle cx="44" cy="66" r="1.3"/><circle cx="66" cy="61" r="1.3"/>
    </g>
  </g>
</svg>
