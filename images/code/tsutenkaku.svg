<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tsutenkaku tower -->
  <g>
    <!-- base building -->
    <rect x="26" y="86" width="48" height="10" fill="#3a3238"/>
    <g fill="#584e55">
      <rect x="29" y="88" width="8" height="3" rx="1"/><rect x="41" y="88" width="8" height="3" rx="1"/>
      <rect x="53" y="88" width="8" height="3" rx="1"/><rect x="65" y="88" width="8" height="3" rx="1"/>
      <rect x="29" y="92" width="8" height="3" rx="1"/><rect x="53" y="92" width="8" height="3" rx="1"/>
    </g>
    <!-- flared legs -->
    <path d="M46 40 L28 86 L34 86 L48 46 Z" fill="#d63b2f"/>
    <path d="M54 40 L72 86 L66 86 L52 46 Z" fill="#d63b2f"/>
    <!-- lattice cross braces -->
    <g stroke="#d63b2f" stroke-width="3" stroke-linecap="round">
      <line x1="34" y1="82" x2="66" y2="60"/>
      <line x1="66" y1="82" x2="34" y2="60"/>
      <line x1="38" y1="66" x2="62" y2="50"/>
      <line x1="62" y1="66" x2="38" y2="50"/>
      <line x1="40" y1="74" x2="60" y2="74"/>
    </g>
    <!-- central column with OSAKA sign -->
    <rect x="44" y="42" width="12" height="34" rx="3" fill="#b12c22"/>
    <g fill="#fdfdfb" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">
      <text x="50" y="50">O</text><text x="50" y="57">S</text><text x="50" y="64">A</text>
      <text x="50" y="71">K</text><text x="50" y="78">A</text>
    </g>
    <!-- clock -->
    <circle cx="50" cy="38" r="6.5" fill="#fdfdfb" stroke="#d63b2f" stroke-width="2.4"/>
    <line x1="50" y1="38" x2="50" y2="34.4" stroke="#3a3238" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="50" y1="38" x2="52.6" y2="38" stroke="#3a3238" stroke-width="1.4" stroke-linecap="round"/>
    <!-- observation deck -->
    <path d="M36 30 L64 30 L60 22 L40 22 Z" fill="#d63b2f"/>
    <rect x="38" y="24" width="24" height="4" rx="2" fill="#3a3238"/>
    <path d="M40 22 L60 22 L57 14 L43 14 Z" fill="#b12c22"/>
    <rect x="42" y="16" width="16" height="3" rx="1.5" fill="#3a3238"/>
    <!-- antenna cap -->
    <rect x="46" y="8" width="8" height="6" rx="2" fill="#d63b2f"/>
    <rect x="48.7" y="2" width="2.6" height="6" rx="1.3" fill="#3a3238"/>
  </g>
</svg>
