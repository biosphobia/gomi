<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Umeda Sky Building -->
  <g>
    <!-- rooftop machinery -->
    <rect x="30" y="4" width="8" height="8" fill="#9aa4ad"/>
    <rect x="62" y="4" width="8" height="8" fill="#9aa4ad"/>
    <!-- left tower -->
    <rect x="14" y="18" width="24" height="78" rx="2" fill="#4f7ba6"/>
    <g stroke="#3d6389" stroke-width="2">
      <line x1="14" y1="34" x2="38" y2="34"/><line x1="14" y1="50" x2="38" y2="50"/>
      <line x1="14" y1="66" x2="38" y2="66"/><line x1="14" y1="82" x2="38" y2="82"/>
      <line x1="26" y1="18" x2="26" y2="96"/>
    </g>
    <rect x="10" y="18" width="6" height="78" rx="2" fill="#c3ccd4"/>
    <!-- right tower -->
    <rect x="62" y="18" width="24" height="78" rx="2" fill="#4f7ba6"/>
    <g stroke="#3d6389" stroke-width="2">
      <line x1="62" y1="34" x2="86" y2="34"/><line x1="62" y1="50" x2="86" y2="50"/>
      <line x1="62" y1="66" x2="86" y2="66"/><line x1="62" y1="82" x2="86" y2="82"/>
      <line x1="74" y1="18" x2="74" y2="96"/>
    </g>
    <rect x="84" y="18" width="6" height="78" rx="2" fill="#c3ccd4"/>
    <!-- sky bridge (floating garden observatory) -->
    <rect x="10" y="12" width="80" height="14" rx="3" fill="#b7c0c8"/>
    <g fill="#3d6389">
      <rect x="24" y="16" width="5" height="6" rx="1"/><rect x="36" y="16" width="5" height="6" rx="1"/>
      <rect x="48" y="16" width="5" height="6" rx="1"/><rect x="60" y="16" width="5" height="6" rx="1"/>
      <rect x="72" y="16" width="5" height="6" rx="1"/>
    </g>
    <!-- escalator tube -->
    <line x1="40" y1="46" x2="60" y2="28" stroke="#9aa4ad" stroke-width="6" stroke-linecap="round"/>
    <!-- circular opening arch -->
    <path d="M38 74 A14 14 0 0 1 62 74" fill="none" stroke="#7d8791" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#7d8791" stroke-width="2.4" stroke-linecap="round">
      <line x1="42" y1="68" x2="42" y2="74"/><line x1="47" y1="64" x2="47" y2="74"/>
      <line x1="52" y1="63" x2="52" y2="74"/><line x1="57" y1="65" x2="57" y2="74"/>
    </g>
    <!-- tower window dots -->
    <g fill="#8fb3d6">
      <rect x="17" y="24" width="5" height="5" rx="1"/><rect x="30" y="24" width="5" height="5" rx="1"/>
      <rect x="17" y="40" width="5" height="5" rx="1"/><rect x="30" y="40" width="5" height="5" rx="1"/>
      <rect x="17" y="56" width="5" height="5" rx="1"/><rect x="30" y="56" width="5" height="5" rx="1"/>
      <rect x="17" y="72" width="5" height="5" rx="1"/><rect x="30" y="72" width="5" height="5" rx="1"/>
      <rect x="65" y="24" width="5" height="5" rx="1"/><rect x="78" y="24" width="5" height="5" rx="1"/>
      <rect x="65" y="40" width="5" height="5" rx="1"/><rect x="78" y="40" width="5" height="5" rx="1"/>
      <rect x="65" y="56" width="5" height="5" rx="1"/><rect x="78" y="56" width="5" height="5" rx="1"/>
      <rect x="65" y="72" width="5" height="5" rx="1"/><rect x="78" y="72" width="5" height="5" rx="1"/>
    </g>
  </g>
</svg>
