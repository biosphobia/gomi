<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>エールお助け隊</title>
<link rel="icon" href="images/logo.svg" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* White field with a red disc in the corner — Japanese-flag motif. */
  .hero {
    background: #ffffff;
    border: 1px solid var(--c-line);
    border-radius: var(--radius);
    padding: 26px 22px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    top: 18px; right: 20px;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: var(--c-red);
  }
  .hero h1 { margin-bottom: 8px; max-width: calc(100% - 96px); }
  .hero .lead { margin-bottom: 0; font-size: 14px; max-width: calc(100% - 96px); }
  @media (max-width: 420px) {
    .hero::after { width: 60px; height: 60px; top: 16px; right: 16px; }
    .hero h1, .hero .lead { max-width: calc(100% - 72px); }
  }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 8px;
  }
  .cat-card {
    background: var(--c-panel);
    border: 1px solid var(--c-line);
    border-radius: var(--radius);
    padding: 22px 20px;
    text-decoration: none;
    color: var(--c-text);
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 5px solid var(--c-accent);
  }
  .cat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .cat-card.soon { border-top-color: var(--c-red); opacity: 0.92; }
  .cat-icon { font-size: 42px; line-height: 1; margin-bottom: 4px; }
  .cat-card h3 { font-size: 18px; font-weight: 800; }
  .cat-card p { font-size: 13px; color: var(--c-muted); line-height: 1.5; }
  .cat-badge {
    align-self: flex-start;
    margin-top: 4px;
    font-size: 11px;
    font-weight: 700;
    color: var(--c-red);
    background: var(--c-red-soft);
    border-radius: 999px;
    padding: 2px 10px;
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="site-brand">
    <img src="images/logo.svg" class="site-logo" alt="" />
    <span class="site-brand-text">エールお助け隊</span>
  </a>
  <nav class="site-nav">
    <a href="index.html" class="nav-link" data-page="home"  data-nav="home">ホーム</a>
    <a href="daily.html" class="nav-link" data-page="daily" data-nav="daily">生活</a>
    <a href="games.html" class="nav-link" data-page="games" data-nav="games">ゲーム</a>
  </nav>
  <button class="site-lang-toggle" type="button">🌐 日本語</button>
</header>

<main class="page">
  <section class="hero">
    <h1 id="heroTitle">大阪で暮らす皆さんへ</h1>
    <p class="lead" id="heroLead">大阪での生活に役立つガイドとツールをまとめました。</p>
  </section>

  <section class="cat-grid">
    <a href="daily.html" class="cat-card">
      <div class="cat-icon">🌸</div>
      <h3 id="catDailyT">生活</h3>
      <p id="catDailyD">動画ガイドと、匿名の相談チャット。</p>
    </a>
    <a href="games.html" class="cat-card">
      <div class="cat-icon">🎮</div>
      <h3 id="catGamesT">ゲーム</h3>
      <p id="catGamesD">ごみ分別ゲームとかなクイズで楽しく学ぼう。</p>
    </a>
    <a href="https://ejuhelp.onrender.com/" class="cat-card">
      <div class="cat-icon">🎓</div>
      <h3 id="catEjuT">EJU</h3>
      <p id="catEjuD">日本留学試験（EJU）の学習サイトへ。</p>
    </a>
  </section>

  <!-- Scan-to-open QR (encodes this site's own URL at runtime) -->
  <section class="qr-card">
    <div class="qr-box" id="qrBox"></div>
    <p class="qr-label" id="qrLabel">QRコードでこのサイトをひらく・シェア</p>
    <p class="qr-url" id="qrUrl"></p>
  </section>

</main>

<script src="common.js"></script>
<script src="qr.js"></script>
<script>
(() => {
  'use strict';
  const HOME_I18N = {
    ja: { heroTitle:'大阪で暮らす皆さんへ', heroLead:'大阪での生活に役立つガイドとツールをまとめました。',
      catDailyT:'生活', catDailyD:'動画ガイドと、匿名の相談チャット。',
      catGamesT:'ゲーム', catGamesD:'ごみ分別ゲームとかなクイズで楽しく学ぼう。',
      qrLabel:'QRコードでこのサイトをひらく・シェア',
      catEjuT:'EJU', catEjuD:'日本留学試験（EJU）の学習サイトへ。' },
    en: { heroTitle:'Welcome to life in Osaka', heroLead:'Guides and tools to help with daily life in Osaka.',
      catDailyT:'Daily Life', catDailyD:'Video guides and an anonymous help chat.',
      catGamesT:'Games', catGamesD:'Learn through the trash-sorting game and kana quiz.',
      qrLabel:'Scan to open or share this site',
      catEjuT:'EJU', catEjuD:'Study site for the EJU (Examination for Japanese University Admission).' },
    zh: { heroTitle:'欢迎在大阪生活', heroLead:'为在大阪生活的人士整理的实用指南和工具。',
      catDailyT:'日常生活', catDailyD:'视频指南与匿名咨询聊天。',
      catGamesT:'游戏', catGamesD:'通过垃圾分类游戏和假名测验快乐学习。',
      qrLabel:'扫码打开或分享本网站',
      catEjuT:'EJU', catEjuD:'前往日本留学考试（EJU）学习网站。' },
    ko: { heroTitle:'오사카에서의 생활을 응원합니다', heroLead:'오사카 생활에 도움이 되는 가이드와 도구 모음입니다.',
      catDailyT:'생활', catDailyD:'동영상 가이드와 익명 상담 채팅.',
      catGamesT:'게임', catGamesD:'쓰레기 분리 게임과 가나 퀴즈로 즐겁게 배우기.',
      qrLabel:'QR코드로 이 사이트 열기·공유',
      catEjuT:'EJU', catEjuD:'일본 유학 시험(EJU) 학습 사이트로 이동.' },
    my: { heroTitle:'အိုဆာကာတွင် နေထိုင်ကြသူများအတွက်', heroLead:'အိုဆာကာတွင် နေထိုင်ရာ၌ အသုံးဝင်သော လမ်းညွှန်များနှင့် ကိရိယာများ။',
      catDailyT:'နေ့စဉ်ဘဝ', catDailyD:'ဗီဒီယိုလမ်းညွှန်နှင့် အမည်ဝှက်အကူအညီ ချက်တင်။',
      catGamesT:'ဂိမ်းများ', catGamesD:'အမှိုက်ခွဲခြားဂိမ်းနှင့် ကာနာပဟေဠိဖြင့် ပျော်ရွှင်စွာ လေ့လာပါ။',
      qrLabel:'ဤဆိုက်ကိုဖွင့်ရန်/မျှဝေရန် QR ကုဒ်ကို စကင်ဖတ်ပါ',
      catEjuT:'EJU', catEjuD:'EJU (ဂျပန်တက္ကသိုလ်ဝင်ခွင့်စာမေးပွဲ) လေ့လာရေးဆိုက်သို့။' },
    vi: { heroTitle:'Chào mừng đến với cuộc sống ở Osaka', heroLead:'Các hướng dẫn và công cụ giúp ích cho cuộc sống ở Osaka.',
      catDailyT:'Đời sống', catDailyD:'Video hướng dẫn và chat hỗ trợ ẩn danh.',
      catGamesT:'Trò chơi', catGamesD:'Học qua trò chơi phân loại rác và trắc nghiệm kana.',
      qrLabel:'Quét mã QR để mở hoặc chia sẻ trang này',
      catEjuT:'EJU', catEjuD:'Đến trang học luyện thi EJU (kỳ thi du học Nhật Bản).' },
  };
  function applyHome() {
    const L = HOME_I18N[getLang()] || HOME_I18N.ja;
    for (const k in L) { const el = document.getElementById(k); if (el) el.textContent = L[k]; }
  }
  function refresh() { applySiteHeader('home'); applyHome(); }
  refresh();
  setupLangToggle(refresh);

  // QR code pointing at this site (whatever domain it is deployed on)
  try {
    const url = (location.origin && location.origin !== 'null')
      ? location.origin + location.pathname.replace(/index\.html$/, '')
      : location.href;
    document.getElementById('qrBox').innerHTML = makeQrSvg(url, 140);
    document.getElementById('qrUrl').textContent = url;
  } catch (e) { console.warn('qr', e); }
})();
</script>
</body>
</html>
