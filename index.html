<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>大阪市ごみ分別ゲーム</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗑️</text></svg>" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c-burnable: #e25b5b;
    --c-recycle:  #d99431;
    --c-plastic:  #3f7cb8;
    --c-bg:       #faf6f0;
    --c-panel:    #ffffff;
    --c-text:     #2a2a2a;
    --c-muted:    #777777;
    --c-line:     #ececec;
    --c-accent:   #ff6a4d;
    --shadow-sm:  0 1px 3px rgba(0,0,0,0.06);
    --shadow-md:  0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg:  0 10px 24px rgba(0,0,0,0.14);
    --radius:     14px;
  }

  html, body { height: 100%; width: 100%; overflow: hidden; }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", "Meiryo",
                 "Noto Sans CJK JP", "Noto Sans CJK SC", "Noto Sans CJK KR",
                 "Noto Sans Myanmar", "Pyidaungsu", "Padauk",
                 system-ui, sans-serif;
    background: var(--c-bg);
    color: var(--c-text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }

  /* Burmese needs a dedicated font fallback */
  [lang="my"], .lang-my {
    font-family: "Noto Sans Myanmar", "Pyidaungsu", "Padauk", "Myanmar Text", sans-serif;
  }

  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    padding: 10px;
    gap: 10px;
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--c-panel);
    padding: 10px 14px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    gap: 8px;
  }
  .title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    flex: 1;
    min-width: 0;
  }
  .title .sub {
    display: block;
    font-size: 10px;
    color: var(--c-muted);
    font-weight: 400;
    margin-top: 2px;
  }
  .lang-toggle {
    background: var(--c-bg);
    border: 1px solid var(--c-line);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--c-text);
    font-family: inherit;
    white-space: nowrap;
  }
  .lang-toggle:hover { background: #f0ebe2; }

  .stats { display: flex; gap: 10px; }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 44px;
  }
  .stat-label {
    font-size: 9px;
    color: var(--c-muted);
    letter-spacing: 0.5px;
  }
  .stat-value {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
  }
  .stat-value.lives { font-size: 13px; letter-spacing: 1px; }

  /* ===== Play area ===== */
  .play-area {
    flex: 1;
    background: var(--c-panel);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    min-height: 240px;
  }
  .hint {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--c-muted);
    font-size: 12px;
    text-align: center;
    padding: 5px 14px;
    background: var(--c-bg);
    border-radius: 999px;
    pointer-events: none;
    transition: opacity 0.2s ease;
    white-space: nowrap;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .streak-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: #fff3e8;
    color: var(--c-accent);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #ffd5c0;
    opacity: 0;
    transform: scale(0.6);
    transition: all 0.2s ease;
    pointer-events: none;
  }
  .streak-badge.show { opacity: 1; transform: scale(1); }

  /* ===== Item ===== */
  .item {
    position: absolute;
    width: 120px;
    height: 120px;
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: grab;
    z-index: 50;
    touch-action: none;
    will-change: transform, left, top;
    border: 1px solid var(--c-line);
  }
  .item.shown { display: flex; }
  .item.dragging {
    cursor: grabbing;
    transform: scale(1.05);
    box-shadow: var(--shadow-lg);
    border-color: var(--c-accent);
  }
  .item.return {
    transition: left 0.28s cubic-bezier(.34,1.56,.64,1), top 0.28s cubic-bezier(.34,1.56,.64,1);
  }
  .item-icon {
    font-size: 52px;
    line-height: 1;
    margin-bottom: 6px;
    pointer-events: none;
  }
  .item-name {
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    padding: 0 6px;
    pointer-events: none;
    color: #444;
    line-height: 1.25;
  }

  /* ===== Bins ===== */
  .bins {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .bin {
    background: var(--c-panel);
    border-radius: var(--radius);
    padding: 12px 6px 10px;
    box-shadow: var(--shadow-sm);
    border-top: 4px solid transparent;
    text-align: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    min-height: 108px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    position: relative;
    overflow: hidden;
  }
  .bin.burnable { border-top-color: var(--c-burnable); }
  .bin.recycle  { border-top-color: var(--c-recycle); }
  .bin.plastic  { border-top-color: var(--c-plastic); }

  .bin.hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-md);
  }
  .bin.hover.burnable { background: #fff5f5; }
  .bin.hover.recycle  { background: #fff8eb; }
  .bin.hover.plastic  { background: #f0f6fc; }

  .bin-icon { font-size: 32px; line-height: 1; }
  .bin-name {
    font-size: 13px;
    font-weight: 700;
    color: #333;
    line-height: 1.2;
  }
  .bin-sub {
    font-size: 9.5px;
    color: var(--c-muted);
    line-height: 1.35;
    font-weight: 500;
  }

  /* ===== Feedback ===== */
  .feedback {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    background: white;
    padding: 18px 22px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    text-align: center;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: all 0.22s ease;
    max-width: calc(100% - 32px);
    width: 280px;
    border: 1px solid var(--c-line);
  }
  .feedback.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  .feedback-emoji {
    font-size: 40px;
    display: block;
    margin-bottom: 4px;
    line-height: 1;
  }
  .feedback-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .feedback.correct .feedback-title { color: #2e7d32; }
  .feedback.wrong .feedback-title { color: #c62828; }
  .feedback-answer {
    font-size: 13px;
    color: #333;
    margin: 4px 0;
    line-height: 1.4;
  }
  .feedback-answer b { color: var(--c-accent); }
  .feedback-tip {
    font-size: 11px;
    color: var(--c-muted);
    line-height: 1.45;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--c-line);
  }
  .points {
    display: inline-block;
    background: #fff3e8;
    color: var(--c-accent);
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    margin-top: 4px;
  }

  /* ===== Overlays ===== */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(250, 246, 240, 0.97);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 20px;
    text-align: center;
    overflow-y: auto;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .overlay.hidden { display: none; }

  .lang-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
  }
  .lang-btn {
    background: var(--c-panel);
    border: 1px solid var(--c-line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--c-text);
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .lang-btn:hover { background: #f5f0e7; }
  .lang-btn.active {
    background: var(--c-accent);
    color: white;
    border-color: var(--c-accent);
  }

  .overlay h1 {
    font-size: 24px;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .overlay h2 {
    font-size: 22px;
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .overlay .lead {
    font-size: 13px;
    color: #555;
    margin-bottom: 14px;
    max-width: 440px;
    line-height: 1.6;
  }
  .rules {
    background: var(--c-panel);
    padding: 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    text-align: left;
    max-width: 440px;
    box-shadow: var(--shadow-sm);
    width: 100%;
    border: 1px solid var(--c-line);
  }
  .rules h3 {
    font-size: 13px;
    margin-bottom: 8px;
    color: #444;
    border-bottom: 1px solid var(--c-line);
    padding-bottom: 6px;
  }
  .rules ul { list-style: none; padding: 0; font-size: 12px; }
  .rules li {
    padding: 5px 0;
    line-height: 1.5;
  }
  .rules li .tag {
    display: inline-block;
    color: white;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 11px;
    margin-right: 4px;
  }
  .rules li .tag.burnable { background: var(--c-burnable); }
  .rules li .tag.recycle  { background: var(--c-recycle); }
  .rules li .tag.plastic  { background: var(--c-plastic); }

  .btn {
    background: var(--c-accent);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 13px 38px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255, 106, 77, 0.3);
    font-family: inherit;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 4px rgba(255, 106, 77, 0.3);
  }

  .score-big {
    font-size: 52px;
    font-weight: 800;
    color: var(--c-accent);
    margin: 4px 0;
    line-height: 1;
  }
  .score-label {
    font-size: 11px;
    color: var(--c-muted);
    letter-spacing: 2px;
  }
  .rank {
    font-size: 20px;
    font-weight: 700;
    margin: 12px 0 8px;
  }
  .end-stats {
    display: flex;
    gap: 18px;
    margin: 8px 0 16px;
    color: #555;
    font-size: 12px;
  }
  .end-stats div b { color: #333; font-size: 16px; display: block; }

  .footer-note {
    font-size: 10px;
    color: var(--c-muted);
    margin-top: 14px;
    line-height: 1.5;
    max-width: 380px;
  }

  /* Animations */
  @keyframes popIn {
    0%   { transform: scale(0.4); opacity: 0; }
    70%  { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1); }
  }
  .item.spawning { animation: popIn 0.32s ease-out; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .play-area.shake { animation: shake 0.35s ease; }

  /* Small screens */
  @media (max-width: 380px) {
    .item { width: 104px; height: 104px; }
    .item-icon { font-size: 44px; }
    .bin-icon { font-size: 28px; }
    .bin-name { font-size: 11.5px; }
    .bin-sub { font-size: 9px; }
    .title { font-size: 13px; }
    .stat-value { font-size: 16px; }
    .lang-btn { font-size: 12px; padding: 5px 10px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="title">
      <span id="hdrTitle">🗑️ 大阪市ごみ分別ゲーム</span>
      <span class="sub" id="hdrSub">Osaka Trash Sorting</span>
    </div>
    <button class="lang-toggle" id="langToggleBtn" type="button">🌐 日本語</button>
    <div class="stats">
      <div class="stat">
        <div class="stat-label" id="lblScore">スコア</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat">
        <div class="stat-label" id="lblRemaining">残り</div>
        <div class="stat-value" id="remaining">15</div>
      </div>
      <div class="stat">
        <div class="stat-label" id="lblLives">ライフ</div>
        <div class="stat-value lives" id="lives">❤️❤️❤️</div>
      </div>
    </div>
  </header>

  <main class="play-area" id="playArea">
    <div class="hint" id="hint">下のごみ箱にドラッグしてね</div>
    <div class="streak-badge" id="streakBadge"></div>
    <div class="feedback" id="feedback"></div>
  </main>

  <section class="bins">
    <div class="bin burnable" data-type="burnable">
      <div class="bin-icon">🔥</div>
      <div class="bin-name" id="binName_burnable">普通ごみ</div>
      <div class="bin-sub" id="binSub_burnable">生ごみ・紙くず<br>革・木くず・おむつ</div>
    </div>
    <div class="bin recycle" data-type="recycle">
      <div class="bin-icon">♻️</div>
      <div class="bin-name" id="binName_recycle">資源ごみ</div>
      <div class="bin-sub" id="binSub_recycle">空き缶・空きびん<br>ペットボトル</div>
    </div>
    <div class="bin plastic" data-type="plastic">
      <div class="bin-icon">🛍️</div>
      <div class="bin-name" id="binName_plastic">容器包装プラスチック</div>
      <div class="bin-sub" id="binSub_plastic">プラマーク付きの<br>容器・包装</div>
    </div>
  </section>

  <div class="item" id="item">
    <div class="item-icon" id="itemIcon"></div>
    <div class="item-name" id="itemName"></div>
  </div>

  <!-- Start overlay -->
  <div class="overlay" id="startOverlay">
    <div class="lang-bar" id="langBar"></div>
    <h1 id="startTitle">🗑️ 大阪市ごみ分別ゲーム</h1>
    <p class="lead" id="startLead"></p>
    <div class="rules">
      <h3 id="rulesTitle"></h3>
      <ul id="rulesList"></ul>
    </div>
    <p class="lead" id="startChallenge"></p>
    <button class="btn" id="startBtn">スタート</button>
    <p class="footer-note" id="startNote"></p>
  </div>

  <!-- End overlay -->
  <div class="overlay hidden" id="endOverlay">
    <h2 id="endTitle"></h2>
    <div class="score-label" id="endScoreLabel">SCORE</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="rank" id="rank"></div>
    <div class="end-stats">
      <div><span id="endLblCorrect"></span><b id="endCorrect">0</b></div>
      <div><span id="endLblWrong"></span><b id="endWrong">0</b></div>
      <div><span id="endLblStreak"></span><b id="endStreak">0</b></div>
    </div>
    <p class="lead" id="endMessage"></p>
    <button class="btn" id="restartBtn">もう一度</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ============ Languages ============
  const LANGS = [
    { code: 'ja', name: '日本語' },
    { code: 'zh', name: '中文' },
    { code: 'ko', name: '한국어' },
    { code: 'my', name: 'မြန်မာ' },
    { code: 'vi', name: 'Tiếng Việt' },
  ];

  // ============ Trash items (Osaka City rules) ============
  // type: 'burnable' = 普通ごみ, 'recycle' = 資源ごみ, 'plastic' = 容器包装プラスチック
  const ITEMS = [

    { icon: '💿', type: 'burnable',

      tip:  { ja: 'CD・DVDは普通ごみです。', zh: 'CD・DVD属于普通垃圾。', ko: 'CD・DVD는 일반 쓰레기.', my: 'CD၊ DVD များသည် ပုံမှန်အမှိုက်။', vi: 'CD và DVD là rác thông thường.' } },

  const TOTAL_ROUNDS = 15;
  const MAX_LIVES = 3;

  // ============ State ============
  const state = {
    lang: 'ja',
    score: 0,
    lives: MAX_LIVES,
    queue: [],
    current: null,
    streak: 0,
    maxStreak: 0,
    correct: 0,
    wrong: 0,
    busy: false,
  };

  // ============ DOM helpers ============
  const $ = (s) => document.querySelector(s);
  const app        = $('#app');
  const playArea   = $('#playArea');
  const itemEl     = $('#item');
  const itemIcon   = $('#itemIcon');
  const itemName   = $('#itemName');
  const scoreEl    = $('#score');
  const remainingEl= $('#remaining');
  const livesEl    = $('#lives');
  const feedbackEl = $('#feedback');
  const hintEl     = $('#hint');
  const streakEl   = $('#streakBadge');
  const bins       = Array.from(document.querySelectorAll('.bin'));

  // ============ I18N apply ============
  function t() { return I18N[state.lang]; }

  function applyLang() {
    const L = t();
    document.documentElement.lang = state.lang;

    // Header
    $('#hdrTitle').textContent = L.title;
    $('#hdrSub').textContent   = L.sub;
    $('#lblScore').textContent = L.score;
    $('#lblRemaining').textContent = L.remaining;
    $('#lblLives').textContent = L.lives;
    $('#hint').textContent     = L.hint;

    // Lang toggle button
    const curLang = LANGS.find(l => l.code === state.lang);
    $('#langToggleBtn').textContent = '🌐 ' + (curLang ? curLang.name : state.lang);

    // Bins
    for (const k of ['burnable','recycle','plastic']) {
      $('#binName_' + k).innerHTML = L.bin[k].name;
      $('#binSub_'  + k).innerHTML = L.bin[k].sub;
    }

    // Start overlay
    $('#startTitle').textContent     = L.title;
    $('#startLead').textContent      = L.start.lead;
    $('#rulesTitle').textContent     = L.start.rulesTitle;
    $('#startChallenge').textContent = L.start.challenge;
    $('#startBtn').textContent       = L.start.btn;
    $('#startNote').textContent      = L.start.note;

    const rulesList = $('#rulesList');
    rulesList.innerHTML = '';
    const tagClassMap = { '普通ごみ': 'burnable', '資源ごみ': 'recycle', '容器包装プラスチック': 'plastic' };
    for (const r of L.start.rules) {
      const li = document.createElement('li');
      li.innerHTML = `<span class="tag ${tagClassMap[r.tag] || ''}">${r.tag}</span> ${r.body}`;
      rulesList.appendChild(li);
    }

    // End overlay
    $('#endScoreLabel').textContent = L.end.scoreLabel;
    $('#endLblCorrect').textContent = L.end.correct + ' ';
    $('#endLblWrong').textContent   = L.end.wrong + ' ';
    $('#endLblStreak').textContent  = L.end.maxStreak + ' ';
    $('#restartBtn').textContent    = L.end.restart;

    // If current item is shown, update its label
    if (state.current) {
      itemName.textContent = state.current.name[state.lang] || state.current.name.ja;
    }

    // Streak badge if visible
    if (state.streak >= 2) streakEl.textContent = L.streak(state.streak);
  }

  function buildLangBar() {
    const bar = $('#langBar');
    bar.innerHTML = '';
    for (const lang of LANGS) {
      const b = document.createElement('button');
      b.className = 'lang-btn' + (state.lang === lang.code ? ' active' : '');
      b.type = 'button';
      b.dataset.lang = lang.code;
      b.textContent = lang.name;
      if (lang.code === 'my') b.classList.add('lang-my');
      b.addEventListener('click', () => setLang(lang.code));
      bar.appendChild(b);
    }
  }

  function setLang(code) {
    if (!I18N[code]) return;
    state.lang = code;
    try { localStorage.setItem('osaka_gomi_lang', code); } catch (_) {}
    buildLangBar();
    applyLang();
  }

  function cycleLang() {
    const idx = LANGS.findIndex(l => l.code === state.lang);
    const next = LANGS[(idx + 1) % LANGS.length];
    setLang(next.code);
  }

  // ============ Game logic ============
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getItemSize() { return itemEl.offsetWidth || 120; }

  function getCenterPos() {
    const playRect = playArea.getBoundingClientRect();
    const appRect  = app.getBoundingClientRect();
    const size = getItemSize();
    return {
      x: (playRect.left - appRect.left) + (playRect.width  - size) / 2,
      y: (playRect.top  - appRect.top)  + (playRect.height - size) / 2,
    };
  }

  function setItemPos(x, y) {
    itemEl.style.left = x + 'px';
    itemEl.style.top  = y + 'px';
  }

  function updateHUD() {
    scoreEl.textContent     = state.score;
    remainingEl.textContent = state.queue.length + (state.current ? 1 : 0);
    livesEl.textContent     = '❤️'.repeat(state.lives) + '🖤'.repeat(MAX_LIVES - state.lives);
  }

  function updateStreak() {
    if (state.streak >= 2) {
      streakEl.textContent = t().streak(state.streak);
      streakEl.classList.add('show');
    } else {
      streakEl.classList.remove('show');
    }
  }

  function spawnItem() {
    if (state.lives <= 0) { endGame(); return; }
    state.current = state.queue.shift() || null;
    if (!state.current) { endGame(); return; }

    itemIcon.textContent = state.current.icon;
    itemName.textContent = state.current.name[state.lang] || state.current.name.ja;

    const c = getCenterPos();
    itemEl.classList.remove('return');
    setItemPos(c.x, c.y);
    itemEl.classList.add('shown');
    itemEl.classList.remove('spawning');
    void itemEl.offsetWidth;
    itemEl.classList.add('spawning');

    hintEl.style.opacity = '1';
    updateHUD();
  }

  function showFeedback(correct, item, points) {
    const L = t();
    const name = item.name[state.lang] || item.name.ja;
    const typeLabel = L.typeLabel[item.type];
    if (correct) {
      feedbackEl.className = 'feedback show correct';
      feedbackEl.innerHTML = `
        <span class="feedback-emoji">🎉</span>
        <div class="feedback-title">${L.fb.correct}</div>
        <div class="feedback-answer">${L.fb.is(name, typeLabel)}</div>
        <div class="points">+${points}</div>
        <div class="feedback-tip">${item.tip[state.lang] || item.tip.ja}</div>
      `;
    } else {
      feedbackEl.className = 'feedback show wrong';
      feedbackEl.innerHTML = `
        <span class="feedback-emoji">😢</span>
        <div class="feedback-title">${L.fb.wrong}</div>
        <div class="feedback-answer">${L.fb.isWrong(name, typeLabel)}</div>
        <div class="feedback-tip">${item.tip[state.lang] || item.tip.ja}</div>
      `;
    }

    const dwell = correct ? 1100 : 1900;
    setTimeout(() => {
      feedbackEl.classList.remove('show');
      setTimeout(() => {
        state.busy = false;
        if (state.lives <= 0 || state.queue.length === 0) endGame();
        else spawnItem();
      }, 220);
    }, dwell);
  }

  function handleDrop(targetType) {
    if (!state.current || state.busy) return;
    state.busy = true;
    itemEl.classList.remove('shown');

    const item = state.current;
    state.current = null;
    const isCorrect = targetType === item.type;

    let points = 0;
    if (isCorrect) {
      state.correct++;
      state.streak++;
      if (state.streak > state.maxStreak) state.maxStreak = state.streak;
      points = 100 + Math.min(state.streak - 1, 10) * 20;
      state.score += points;
    } else {
      state.wrong++;
      state.streak = 0;
      state.lives--;
      playArea.classList.remove('shake');
      void playArea.offsetWidth;
      playArea.classList.add('shake');
    }
    updateHUD();
    updateStreak();
    showFeedback(isCorrect, item, points);
  }

  function returnToCenter() {
    const c = getCenterPos();
    itemEl.classList.add('return');
    setItemPos(c.x, c.y);
    hintEl.style.opacity = '1';
    setTimeout(() => itemEl.classList.remove('return'), 300);
  }

  function endGame() {
    itemEl.classList.remove('shown');
    streakEl.classList.remove('show');
    const L = t();

    $('#finalScore').textContent = state.score;
    $('#endCorrect').textContent = state.correct;
    $('#endWrong').textContent   = state.wrong;
    $('#endStreak').textContent  = state.maxStreak;

    let rankKey, msgKey;
    if (state.lives <= 0) {
      $('#endTitle').textContent = L.end.gameOver;
      rankKey = 'fail'; msgKey = 'fail';
    } else {
      $('#endTitle').textContent = L.end.clear;
      const ratio = state.correct / TOTAL_ROUNDS;
      if (state.wrong === 0 && state.score >= 1800) { rankKey = 'master'; msgKey = 'master'; }
      else if (ratio >= 0.9) { rankKey = 'gold';   msgKey = 'gold'; }
      else if (ratio >= 0.7) { rankKey = 'silver'; msgKey = 'silver'; }
      else                    { rankKey = 'bronze'; msgKey = 'bronze'; }
    }
    $('#rank').textContent       = L.end.ranks[rankKey];
    $('#endMessage').textContent = L.end.msgs[msgKey];

    $('#endOverlay').classList.remove('hidden');
  }

  function startGame() {
    state.score = 0;
    state.lives = MAX_LIVES;
    state.streak = 0;
    state.maxStreak = 0;
    state.correct = 0;
    state.wrong = 0;
    state.busy = false;
    state.current = null;
    state.queue = shuffle(ITEMS).slice(0, TOTAL_ROUNDS);

    feedbackEl.classList.remove('show');
    $('#startOverlay').classList.add('hidden');
    $('#endOverlay').classList.add('hidden');
    updateHUD();
    updateStreak();
    spawnItem();
  }

  // ============ Drag (Pointer Events) ============
  let dragging = false;
  let pointerId = null;
  let offsetX = 0, offsetY = 0;

  function onPointerDown(e) {
    if (state.busy || !state.current) return;
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    pointerId = e.pointerId;
    itemEl.classList.add('dragging');
    itemEl.classList.remove('return');
    hintEl.style.opacity = '0';

    const rect = itemEl.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    try { itemEl.setPointerCapture(pointerId); } catch (_) {}
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!dragging) return;
    const appRect = app.getBoundingClientRect();
    const x = e.clientX - appRect.left - offsetX;
    const y = e.clientY - appRect.top  - offsetY;
    setItemPos(x, y);

    let hovered = null;
    for (const b of bins) {
      const r = b.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
        hovered = b; break;
      }
    }
    for (const b of bins) b.classList.toggle('hover', b === hovered);
  }

  function onPointerUp(e) {
    if (!dragging) return;
    dragging = false;
    itemEl.classList.remove('dragging');
    try { itemEl.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;

    let target = null;
    for (const b of bins) {
      b.classList.remove('hover');
      const r = b.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
        target = b;
      }
    }
    if (target) handleDrop(target.dataset.type);
    else returnToCenter();
  }

  itemEl.addEventListener('pointerdown',  onPointerDown);
  itemEl.addEventListener('pointermove',  onPointerMove);
  itemEl.addEventListener('pointerup',    onPointerUp);
  itemEl.addEventListener('pointercancel', onPointerUp);

  $('#startBtn').addEventListener('click', startGame);
  $('#restartBtn').addEventListener('click', startGame);
  $('#langToggleBtn').addEventListener('click', cycleLang);

  window.addEventListener('resize', () => {
    if (!dragging && state.current && itemEl.classList.contains('shown')) {
      const c = getCenterPos();
      setItemPos(c.x, c.y);
    }
  });

  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // ============ Boot ============
  try {
    const saved = localStorage.getItem('osaka_gomi_lang');
    if (saved && I18N[saved]) state.lang = saved;
  } catch (_) {}
  buildLangBar();
  applyLang();
})();
</script>
</body>
</html>
