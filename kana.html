<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>📝 かなクイズ / Kana Quiz — Osaka Support</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* Tighten the page chrome on this screen — the kana grid is long. */
  .page { padding-top: 12px; padding-bottom: 20px; }
  #viewSetup > h1 { margin-bottom: 2px; }
  #viewSetup > .lead { margin-bottom: 8px; font-size: 13px; }
  #modeTitle { margin-top: 4px; margin-bottom: 4px; font-size: 16px; }

  /* ---- Side-by-side column headers (hiragana | katakana) ---- */
  .grid-col-head {
    display: flex;
    align-items: stretch;
    gap: var(--kana-gap);
    margin: 6px 0 6px;
  }
  .col-head-spacer { width: var(--rowtoggle-w); flex-shrink: 0; }
  .col-head {
    width: var(--block-w);
    flex-shrink: 0;
    text-align: left;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--c-line);
    background: var(--c-panel);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--c-text);
    font-family: inherit;
  }
  .col-head:hover { border-color: var(--c-accent); }
  .col-head .cnt { color: var(--c-muted); font-weight: 500; margin-left: 6px; }

  /* ---- Preset buttons ---- */
  .preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .preset-btn {
    background: var(--c-panel);
    border: 1px solid var(--c-line);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--c-text);
    font-family: inherit;
  }
  .preset-btn:hover { background: var(--c-bg); }

  /* ---- Category quick toggles (dakuten / yoon) ---- */
  .cat-toggle-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .cat-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--c-panel);
    border: 1px solid var(--c-line);
    border-radius: 999px;
    padding: 6px 14px 6px 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--c-text);
    font-family: inherit;
  }
  .cat-toggle .cat-kana {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    height: 28px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--c-bg);
    font-size: 16px;
    line-height: 1;
  }
  .cat-toggle .cat-state {
    font-size: 11px;
    color: var(--c-muted);
    font-weight: 700;
  }
  .cat-toggle.on {
    border-color: var(--c-accent);
    background: #fff5ee;
    color: var(--c-accent);
  }
  .cat-toggle.on .cat-kana { background: var(--c-accent); color: #fff; }
  .cat-toggle.on .cat-state { color: var(--c-accent); }

  /* ---- Kana groups / rows / chips ---- */
  /* Shared sizing so the katakana column lines up under its header.
     --chip-w * 5 + --kana-gap * 4 == --block-w (one script's 5 cells). */
  #viewSetup {
    --chip-w: 46px;
    --kana-gap: 5px;
    --rowtoggle-w: 28px;
    --block-w: 250px; /* 5*46 + 4*5 */
  }
  .kana-group { margin-bottom: 10px; }
  .kana-group-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    gap: 8px;
  }
  .kana-group-head h3 {
    font-size: 14px;
    font-weight: 700;
  }
  .group-toggle {
    background: transparent;
    border: 1px solid var(--c-line);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--c-muted);
    font-family: inherit;
  }
  .group-toggle:hover { color: var(--c-accent); border-color: var(--c-accent); }

  .kana-row {
    display: flex;
    align-items: center;
    gap: var(--kana-gap);
    margin-bottom: 4px;
  }
  .row-toggle {
    flex-shrink: 0;
    width: var(--rowtoggle-w);
    height: 42px;
    border-radius: 8px;
    border: 1px solid var(--c-line);
    background: var(--c-panel);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    color: var(--c-muted);
    font-family: ui-monospace, Menlo, monospace;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .row-toggle:hover { border-color: var(--c-accent); }
  /* One script's cells. Fixed width so the katakana block always starts
     at the same x, even on rows with fewer than 5 kana. */
  .row-cells {
    display: flex;
    gap: var(--kana-gap);
    width: var(--block-w);
    flex-shrink: 0;
  }
  .kana-chip {
    width: var(--chip-w);
    min-height: 44px;
    border-radius: 9px;
    border: 1px solid var(--c-line);
    background: var(--c-panel);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    font-family: inherit;
    padding: 3px 2px;
    transition: transform 0.08s ease;
    opacity: 0.45;
  }
  .kana-chip:active { transform: scale(0.94); }
  .kana-chip .ch { font-size: 19px; line-height: 1.15; color: var(--c-text); }
  .kana-chip .rj { font-size: 9px; color: var(--c-muted); margin-top: 1px; }
  .kana-chip.on {
    opacity: 1;
    border-color: var(--c-accent);
    background: #fff5ee;
  }
  .kana-chip.on .rj { color: var(--c-accent); font-weight: 600; }

  /* Narrow screens: shrink chips so both columns still fit. */
  @media (max-width: 560px) {
    #viewSetup { --chip-w: 30px; --block-w: 170px; } /* 5*30 + 4*5 */
    .kana-chip .ch { font-size: 16px; }
    .col-head { font-size: 11.5px; padding: 5px 8px; }
  }

  /* ---- Mode selection ---- */
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px;
    margin: 4px 0 10px;
  }
  .mode-card {
    border: 2px solid var(--c-line);
    border-radius: var(--radius);
    padding: 10px 14px;
    cursor: pointer;
    background: var(--c-panel);
  }
  .mode-card.active { border-color: var(--c-accent); background: #fff5ee; }
  .mode-card h4 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .mode-card p { font-size: 11.5px; color: var(--c-muted); line-height: 1.4; }
  .count-options {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .count-btn {
    background: var(--c-panel);
    border: 1px solid var(--c-line);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--c-text);
    font-family: inherit;
  }
  .count-btn.active { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }

  .start-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .sel-summary { font-size: 12px; color: var(--c-muted); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---- Quiz screen ---- */
  .quiz-wrap { max-width: 460px; margin: 0 auto; }
  .quiz-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
  }
  .progress-text { font-size: 13px; font-weight: 700; }
  .progress-bar {
    height: 8px;
    background: var(--c-line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--c-accent);
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .quiz-card {
    background: var(--c-panel);
    border: 1px solid var(--c-line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 30px 20px 22px;
    text-align: center;
  }
  .quiz-script-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--c-muted);
    margin-bottom: 6px;
  }
  .quiz-kana {
    font-size: 96px;
    line-height: 1.1;
    margin: 4px 0 14px;
    color: var(--c-text);
  }
  .quiz-input {
    width: 100%;
    max-width: 260px;
    padding: 12px 14px;
    border: 2px solid var(--c-line);
    border-radius: 12px;
    font-size: 20px;
    text-align: center;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .quiz-input:focus { outline: none; border-color: var(--c-accent); }
  .quiz-input.correct { border-color: #2e7d32; background: #f1f8f1; }
  .quiz-input.wrong { border-color: #c62828; background: #fdf2f2; }

  .quiz-feedback {
    min-height: 30px;
    margin-top: 12px;
    font-size: 15px;
    font-weight: 700;
  }
  .quiz-feedback.correct { color: #2e7d32; }
  .quiz-feedback.wrong { color: #c62828; }
  .quiz-feedback .ans { color: var(--c-text); font-weight: 800; }

  .quiz-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  .quiz-btn {
    border: 1px solid var(--c-line);
    background: var(--c-panel);
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    color: var(--c-text);
  }
  .quiz-btn.primary { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }
  .quiz-btn.ghost { color: var(--c-muted); }
  .quiz-btn.active { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }

  .quiz-stats-line {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--c-muted);
  }
  .quiz-stats-line b { color: var(--c-text); }

  /* ---- Results ---- */
  .result-card {
    background: var(--c-panel);
    border: 1px solid var(--c-line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 24px 20px;
    text-align: center;
    max-width: 460px;
    margin: 0 auto;
  }
  .result-big { font-size: 46px; font-weight: 800; color: var(--c-accent); line-height: 1; margin: 6px 0; }
  .result-stats { display: flex; justify-content: center; gap: 22px; margin: 14px 0; }
  .result-stats div { font-size: 12px; color: var(--c-muted); }
  .result-stats b { display: block; font-size: 20px; color: var(--c-text); }
  .review-list {
    text-align: left;
    margin: 14px 0 4px;
    border-top: 1px solid var(--c-line);
    padding-top: 12px;
  }
  .review-list h4 { font-size: 13px; margin-bottom: 8px; }
  .review-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fdf2f2;
    border: 1px solid #f3d2d2;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 13px;
    margin: 0 4px 6px 0;
  }
  .review-chip .rc-kana { font-size: 16px; }
  .review-chip .rc-n { font-size: 11px; color: #c62828; font-weight: 700; }
  .result-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="site-brand">🏯 大阪サポート</a>
  <nav class="site-nav">
    <a href="index.html"   class="nav-link" data-page="home"    data-nav="home">ホーム</a>
    <a href="game.html"    class="nav-link" data-page="game"    data-nav="game">ごみゲーム</a>
    <a href="kana.html"    class="nav-link" data-page="kana"    data-nav="kana">かなクイズ</a>
    <a href="videos.html"  class="nav-link" data-page="videos"  data-nav="videos">動画</a>
    <a href="contact.html" class="nav-link" data-page="contact" data-nav="contact">相談チャット</a>
  </nav>
  <button class="site-lang-toggle" type="button">🌐 日本語</button>
</header>

<main class="page">

  <!-- ===== Setup ===== -->
  <section id="viewSetup">
    <h1 id="setupTitle">📝 かなクイズ</h1>
    <p class="lead" id="setupLead">出題するかなを選んでクイズを始めましょう。</p>

    <div class="preset-row">
      <button class="preset-btn" type="button" id="presetAll">＋ <span id="presetAllL">すべて</span></button>
      <button class="preset-btn" type="button" id="presetNone">－ <span id="presetNoneL">なし</span></button>
      <button class="preset-btn" type="button" id="presetBasic"><span id="presetBasicL">基本のみ</span></button>
    </div>

    <div class="cat-toggle-row">
      <button class="cat-toggle" type="button" id="catDakuten">
        <span class="cat-kana" id="catDakutenKana">が</span>
        <span id="catDakutenL">濁音・半濁音</span>
        <span class="cat-state" id="catDakutenState">OFF</span>
      </button>
      <button class="cat-toggle" type="button" id="catCombo">
        <span class="cat-kana" id="catComboKana">きゃ</span>
        <span id="catComboL">拗音</span>
        <span class="cat-state" id="catComboState">OFF</span>
      </button>
    </div>

    <div id="kanaGrid"></div>

    <h2 id="modeTitle">モード</h2>
    <div class="mode-grid">
      <div class="mode-card active" data-mode="master" id="modeMasterCard">
        <h4 id="modeMasterName">マスターモード</h4>
        <p id="modeMasterDesc">選んだ全てのかなを1回ずつ正解するまで続きます。</p>
      </div>
      <div class="mode-card" data-mode="count" id="modeCountCard">
        <h4 id="modeCountName">カウントモード</h4>
        <p id="modeCountDesc">指定した数だけ正解したら終了します。</p>
        <div class="count-options" id="countOptions"></div>
      </div>
    </div>

    <div class="start-bar">
      <button class="btn" type="button" id="startBtn">スタート</button>
      <span class="sel-summary" id="selSummary"></span>
    </div>
  </section>

  <!-- ===== Quiz ===== -->
  <section id="viewQuiz" class="hidden">
    <div class="quiz-wrap">
      <div class="quiz-top">
        <span class="progress-text" id="progressText"></span>
        <div style="display:flex; gap:6px;">
          <button class="quiz-btn ghost hidden" type="button" id="ttsBtn">🔊 <span id="ttsL">音声</span>: OFF</button>
          <button class="quiz-btn ghost" type="button" id="quitBtn">✕ <span id="quitL">やめる</span></button>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

      <div class="quiz-card">
        <div class="quiz-script-label" id="quizScriptLabel"></div>
        <div class="quiz-kana" id="quizKana">あ</div>
        <input class="quiz-input" id="quizInput" type="text"
               autocomplete="off" autocorrect="off" autocapitalize="off"
               spellcheck="false" inputmode="latin" />
        <div class="quiz-feedback" id="quizFeedback"></div>
        <div class="quiz-actions">
          <button class="quiz-btn primary" type="button" id="nextBtn"><span id="checkL">こたえる</span></button>
        </div>
      </div>

      <div class="quiz-stats-line">
        <span><span id="statCorrectL">正解</span> <b id="statCorrect">0</b></span>
        <span><span id="statWrongL">不正解</span> <b id="statWrong">0</b></span>
        <span><span id="statStreakL">連続</span> <b id="statStreak">0</b></span>
      </div>
    </div>
  </section>

  <!-- ===== Results ===== -->
  <section id="viewResults" class="hidden">
    <div class="result-card">
      <h2 id="resultTitle">🎉 おつかれさま！</h2>
      <div class="result-big" id="resultAccuracy">0%</div>
      <div class="result-stats">
        <div><b id="resTotal">0</b><span id="resTotalL">問題</span></div>
        <div><b id="resCorrect">0</b><span id="resCorrectL">正解</span></div>
        <div><b id="resTime">0:00</b><span id="resTimeL">時間</span></div>
      </div>
      <div class="review-list hidden" id="reviewBox">
        <h4 id="reviewTitle">復習したいかな</h4>
        <div id="reviewChips"></div>
      </div>
      <div class="result-actions">
        <button class="btn" type="button" id="againBtn">もう一度</button>
        <button class="btn btn-ghost" type="button" id="backSetupBtn">設定にもどる</button>
      </div>
    </div>
  </section>

</main>

<!--
  Google Cloud Text-to-Speech key. The @@…@@ placeholder is
  rewritten by Render's buildCommand at deploy time from the
  GOOGLE_TTS_API_KEY env var. Left as @@…@@ on local dev, in which
  case the 🔊 audio toggle simply stays hidden.
-->
<script>
window.GOOGLE_TTS_API_KEY = "@@GOOGLE_TTS_API_KEY@@";
</script>
<script src="common.js"></script>
<script>
(() => {
  'use strict';

  /* ===========================================================
     Kana data. Each cell: { h: hiragana, k: katakana, r: romaji,
     alt: [accepted alternates] }. The hiragana char doubles as a
     stable id for the syllable across both scripts.
     =========================================================== */
  const KANA_GROUPS = [
    { id: 'basic', rows: [
      { id: 'a',  cells: [ {h:'あ',k:'ア',r:'a'}, {h:'い',k:'イ',r:'i'}, {h:'う',k:'ウ',r:'u'}, {h:'え',k:'エ',r:'e'}, {h:'お',k:'オ',r:'o'} ] },
      { id: 'k',  cells: [ {h:'か',k:'カ',r:'ka'}, {h:'き',k:'キ',r:'ki'}, {h:'く',k:'ク',r:'ku'}, {h:'け',k:'ケ',r:'ke'}, {h:'こ',k:'コ',r:'ko'} ] },
      { id: 's',  cells: [ {h:'さ',k:'サ',r:'sa'}, {h:'し',k:'シ',r:'shi',alt:['si']}, {h:'す',k:'ス',r:'su'}, {h:'せ',k:'セ',r:'se'}, {h:'そ',k:'ソ',r:'so'} ] },
      { id: 't',  cells: [ {h:'た',k:'タ',r:'ta'}, {h:'ち',k:'チ',r:'chi',alt:['ti']}, {h:'つ',k:'ツ',r:'tsu',alt:['tu']}, {h:'て',k:'テ',r:'te'}, {h:'と',k:'ト',r:'to'} ] },
      { id: 'n',  cells: [ {h:'な',k:'ナ',r:'na'}, {h:'に',k:'ニ',r:'ni'}, {h:'ぬ',k:'ヌ',r:'nu'}, {h:'ね',k:'ネ',r:'ne'}, {h:'の',k:'ノ',r:'no'} ] },
      { id: 'h',  cells: [ {h:'は',k:'ハ',r:'ha'}, {h:'ひ',k:'ヒ',r:'hi'}, {h:'ふ',k:'フ',r:'fu',alt:['hu']}, {h:'へ',k:'ヘ',r:'he'}, {h:'ほ',k:'ホ',r:'ho'} ] },
      { id: 'm',  cells: [ {h:'ま',k:'マ',r:'ma'}, {h:'み',k:'ミ',r:'mi'}, {h:'む',k:'ム',r:'mu'}, {h:'め',k:'メ',r:'me'}, {h:'も',k:'モ',r:'mo'} ] },
      { id: 'y',  cells: [ {h:'や',k:'ヤ',r:'ya'}, {h:'ゆ',k:'ユ',r:'yu'}, {h:'よ',k:'ヨ',r:'yo'} ] },
      { id: 'r',  cells: [ {h:'ら',k:'ラ',r:'ra'}, {h:'り',k:'リ',r:'ri'}, {h:'る',k:'ル',r:'ru'}, {h:'れ',k:'レ',r:'re'}, {h:'ろ',k:'ロ',r:'ro'} ] },
      { id: 'w',  cells: [ {h:'わ',k:'ワ',r:'wa'}, {h:'を',k:'ヲ',r:'wo',alt:['o']} ] },
      { id: 'nn', cells: [ {h:'ん',k:'ン',r:'n',alt:['nn',"n'"]} ] },
    ]},
    { id: 'dakuten', rows: [
      { id: 'g', cells: [ {h:'が',k:'ガ',r:'ga'}, {h:'ぎ',k:'ギ',r:'gi'}, {h:'ぐ',k:'グ',r:'gu'}, {h:'げ',k:'ゲ',r:'ge'}, {h:'ご',k:'ゴ',r:'go'} ] },
      { id: 'z', cells: [ {h:'ざ',k:'ザ',r:'za'}, {h:'じ',k:'ジ',r:'ji',alt:['zi']}, {h:'ず',k:'ズ',r:'zu'}, {h:'ぜ',k:'ゼ',r:'ze'}, {h:'ぞ',k:'ゾ',r:'zo'} ] },
      { id: 'd', cells: [ {h:'だ',k:'ダ',r:'da'}, {h:'ぢ',k:'ヂ',r:'ji',alt:['di','zi']}, {h:'づ',k:'ヅ',r:'zu',alt:['du']}, {h:'で',k:'デ',r:'de'}, {h:'ど',k:'ド',r:'do'} ] },
      { id: 'b', cells: [ {h:'ば',k:'バ',r:'ba'}, {h:'び',k:'ビ',r:'bi'}, {h:'ぶ',k:'ブ',r:'bu'}, {h:'べ',k:'ベ',r:'be'}, {h:'ぼ',k:'ボ',r:'bo'} ] },
      { id: 'p', cells: [ {h:'ぱ',k:'パ',r:'pa'}, {h:'ぴ',k:'ピ',r:'pi'}, {h:'ぷ',k:'プ',r:'pu'}, {h:'ぺ',k:'ペ',r:'pe'}, {h:'ぽ',k:'ポ',r:'po'} ] },
    ]},
    { id: 'combo', rows: [
      { id: 'ky', cells: [ {h:'きゃ',k:'キャ',r:'kya'}, {h:'きゅ',k:'キュ',r:'kyu'}, {h:'きょ',k:'キョ',r:'kyo'} ] },
      { id: 'sh', cells: [ {h:'しゃ',k:'シャ',r:'sha',alt:['sya']}, {h:'しゅ',k:'シュ',r:'shu',alt:['syu']}, {h:'しょ',k:'ショ',r:'sho',alt:['syo']} ] },

  const GROUP_KEY = { basic:'groupBasic', dakuten:'groupDakuten', combo:'groupCombo' };

  function L() { return I18N[getLang()] || I18N.ja; }

  /* ===========================================================
     Google Cloud Text-to-Speech (optional)
     Reads GOOGLE_TTS_API_KEY injected by Render. When present, a
     🔊 toggle appears in the quiz and the kana's reading is played
     after each answer (right or wrong). Audio is cached per kana.
     =========================================================== */
  function isRealValue(v) {
    return typeof v === 'string' && v.trim().length > 0 && !v.startsWith('@@');
  }
  const TTS_KEY = isRealValue(window.GOOGLE_TTS_API_KEY) ? window.GOOGLE_TTS_API_KEY.trim() : '';
  const ttsSupported = !!TTS_KEY;
  const ttsCache = new Map(); // kana char -> object URL / data URI
  let ttsAudio = null;

  async function playKanaTTS(char) {
    if (!TTS_KEY || !char) return;
    try {
      let url = ttsCache.get(char);
      if (!url) {
        const res = await fetch(
          'https://texttospeech.googleapis.com/v1/text:synthesize?key=' + encodeURIComponent(TTS_KEY),
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              input: { text: char },
              voice: { languageCode: 'ja-JP' },
              audioConfig: { audioEncoding: 'MP3' },
            }),
          }
        );
        if (!res.ok) { console.warn('tts http', res.status); return; }
        const json = await res.json();
        if (!json.audioContent) return;
        url = 'data:audio/mp3;base64,' + json.audioContent;
        ttsCache.set(char, url);
      }
      if (ttsAudio) { try { ttsAudio.pause(); } catch (_) {} }
      ttsAudio = new Audio(url);
      ttsAudio.play().catch(() => {});
    } catch (e) {
      console.warn('tts err', e);
    }
  }

  function updateTtsButton() {
    const btn = $('ttsBtn');
    if (!btn) return;
    if (!ttsSupported) { btn.classList.add('hidden'); return; }
    btn.classList.remove('hidden');
    btn.innerHTML = '🔊 <span>' + L().tts + '</span>: ' + (state.ttsOn ? 'ON' : 'OFF');
    btn.classList.toggle('active', state.ttsOn);
  }

  const state = {
    selected: { h: new Set(), k: new Set() }, // independent per-script selection
    mode: 'master',

    pool: [],

    queue: [],

  const $ = (id) => document.getElementById(id);

  /* ===========================================================
     Setup screen — build the kana grid
     =========================================================== */
  const ALL_CELLS = Object.values(CELL_BY_ID);

  function makeChip(cell, sc) {
    const set = state.selected[sc];
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'kana-chip' + (set.has(cell.h) ? ' on' : '');
    const ch = document.createElement('span');
    ch.className = 'ch';
    ch.textContent = sc === 'h' ? cell.h : cell.k;
    const rj = document.createElement('span');
    rj.className = 'rj';
    rj.textContent = cell.r;
    chip.appendChild(ch);
    chip.appendChild(rj);
    chip.addEventListener('click', () => {
      if (set.has(cell.h)) set.delete(cell.h); else set.add(cell.h);
      chip.classList.toggle('on');
      refreshCounts();
    });
    return chip;
  }

  function buildGrid() {
    const wrap = $('kanaGrid');
    wrap.innerHTML = '';
    const Li = L();

    // Column headers: Hiragana | Katakana, each a select-all toggle + count.
    const colHead = document.createElement('div');
    colHead.className = 'grid-col-head';
    const spacer = document.createElement('span');
    spacer.className = 'col-head-spacer';
    colHead.appendChild(spacer);
    for (const sc of ['h', 'k']) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'col-head';
      b.id = sc === 'h' ? 'colHeadH' : 'colHeadK';
      const label = document.createElement('span');
      label.textContent = sc === 'h' ? Li.hira : Li.kata;
      const cnt = document.createElement('span');
      cnt.className = 'cnt';
      cnt.id = sc === 'h' ? 'colCountH' : 'colCountK';
      cnt.textContent = state.selected[sc].size;
      b.appendChild(label);
      b.appendChild(cnt);
      b.addEventListener('click', () => toggleScriptAll(sc));
      colHead.appendChild(b);
    }
    wrap.appendChild(colHead);

    for (const group of KANA_GROUPS) {
      const gEl = document.createElement('div');
      gEl.className = 'kana-group';
      const head = document.createElement('div');
      head.className = 'kana-group-head';
      const h3 = document.createElement('h3');
      h3.textContent = Li[GROUP_KEY[group.id]];
      const gToggle = document.createElement('button');
      gToggle.className = 'group-toggle';
      gToggle.type = 'button';
      gToggle.textContent = '◧';
      gToggle.title = group.id;
      gToggle.addEventListener('click', () => toggleGroup(group));
      head.appendChild(h3);
      head.appendChild(gToggle);
      gEl.appendChild(head);

      for (const row of group.rows) {
        const rEl = document.createElement('div');
        rEl.className = 'kana-row';
        const rToggle = document.createElement('button');
        rToggle.className = 'row-toggle';
        rToggle.type = 'button';
        rToggle.textContent = row.cells[0].r;
        rToggle.title = row.cells[0].r;
        rToggle.addEventListener('click', () => toggleRow(row));
        rEl.appendChild(rToggle);

        // Hiragana block, then katakana block to its right.
        for (const sc of ['h', 'k']) {
          const block = document.createElement('div');
          block.className = 'row-cells';
          for (const cell of row.cells) block.appendChild(makeChip(cell, sc));
          rEl.appendChild(block);
        }
        gEl.appendChild(rEl);
      }
      wrap.appendChild(gEl);
    }
  }

  // Bulk helpers act on BOTH scripts (the column headers do per-script).
  function bothAllOn(cells) {
    return cells.every(c => state.selected.h.has(c.h) && state.selected.k.has(c.h));
  }
  function setBoth(cells, on) {
    for (const c of cells) {
      if (on) { state.selected.h.add(c.h); state.selected.k.add(c.h); }
      else    { state.selected.h.delete(c.h); state.selected.k.delete(c.h); }
    }
  }
  function toggleRow(row) {
    setBoth(row.cells, !bothAllOn(row.cells));
    buildGrid(); refreshCounts();
  }
  function toggleGroup(group) {
    const cells = group.rows.flatMap(r => r.cells);
    setBoth(cells, !bothAllOn(cells));
    buildGrid(); refreshCounts();
  }
  function presetAll() {
    setBoth(ALL_CELLS, true);
    buildGrid(); refreshCounts();
  }
  function presetNone() {
    state.selected = { h: new Set(), k: new Set() };
    buildGrid(); refreshCounts();
  }
  function presetBasic() {
    state.selected = { h: new Set(), k: new Set() };
    for (const r of KANA_GROUPS[0].rows) setBoth(r.cells, true);
    buildGrid(); refreshCounts();
  }
  // Per-script select-all / clear from a column header.
  function toggleScriptAll(sc) {
    const set = state.selected[sc];
    const allOn = ALL_CELLS.every(c => set.has(c.h));
    state.selected[sc] = new Set();
    if (!allOn) for (const c of ALL_CELLS) state.selected[sc].add(c.h);
    buildGrid(); refreshCounts();
  }

  function refreshCounts() {
    const h = state.selected.h.size, k = state.selected.k.size;
    if ($('colCountH')) $('colCountH').textContent = h;
    if ($('colCountK')) $('colCountK').textContent = k;
    $('selSummary').textContent = L().selSummary(h + k);
    $('startBtn').disabled = (h + k) === 0;
    refreshCatToggles();
  }

  // Category quick toggles (dakuten / yoon) — "on" when the whole
  // category is selected in BOTH scripts.
  function groupAllSelected(groupId) {
    const cells = KANA_GROUPS.find(x => x.id === groupId).rows.flatMap(r => r.cells);
    return bothAllOn(cells);
  }
  function toggleGroupById(groupId) {
    toggleGroup(KANA_GROUPS.find(x => x.id === groupId));
  }
  function refreshCatToggles() {
    const dOn = groupAllSelected('dakuten');
    const cOn = groupAllSelected('combo');
    $('catDakuten').classList.toggle('on', dOn);
    $('catCombo').classList.toggle('on', cOn);
    $('catDakutenState').textContent = dOn ? 'ON' : 'OFF';
    $('catComboState').textContent   = cOn ? 'ON' : 'OFF';
  }

  function buildCountOptions() {
    const wrap = $('countOptions');
    wrap.innerHTML = '';
    for (const n of COUNT_PRESETS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'count-btn' + (state.count === n ? ' active' : '');
      b.textContent = n;
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        state.count = n;
        state.mode = 'count';
        setMode('count');
        buildCountOptions();
      });
      wrap.appendChild(b);
    }
  }

  function setMode(mode) {
    state.mode = mode;
    $('modeMasterCard').classList.toggle('active', mode === 'master');
    $('modeCountCard').classList.toggle('active', mode === 'count');
  }

  /* ===========================================================
     Quiz
     =========================================================== */
  function buildPool() {
    const pool = [];
    for (const g of KANA_GROUPS) for (const row of g.rows) for (const cell of row.cells) {
      if (state.selected.h.has(cell.h)) pool.push({ char: cell.h, script: 'h', r: cell.r, alt: cell.alt || [] });
      if (state.selected.k.has(cell.h)) pool.push({ char: cell.k, script: 'k', r: cell.r, alt: cell.alt || [] });
    }
    return pool;
  }

  function startQuiz() {
    const pool = buildPool();
    if (!pool.length) { alert(L().needSelection); return; }
    state.pool = pool;
    state.answered = 0;
    state.correct = 0;
    state.wrong = 0;
    state.streak = 0;
    state.mistakes = {};
    state.lastChar = null;
    state.awaitingNext = false;
    state.finished = false;
    state.startTime = Date.now();

    if (state.mode === 'master') {
      state.remaining = new Set(pool.map(p => p.char));
    } else {
      state.remaining = null;
    }

    showView('viewQuiz');
    applyI18n();
    nextQuestion();
  }

  function poolByChar(char) { return state.pool.find(p => p.char === char); }

  function pickNext() {
    if (state.mode === 'master') {
      const chars = [...state.remaining];
      if (!chars.length) return null;
      let candidates = chars;
      if (chars.length > 1 && state.lastChar) candidates = chars.filter(c => c !== state.lastChar);
      const char = candidates[Math.floor(Math.random() * candidates.length)];
      return poolByChar(char);
    } else {
      let candidates = state.pool;
      if (state.pool.length > 1 && state.lastChar) candidates = state.pool.filter(p => p.char !== state.lastChar);
      return candidates[Math.floor(Math.random() * candidates.length)];
    }
  }

  function nextQuestion() {
    const q = pickNext();
    if (!q) { finishQuiz(); return; }
    state.current = q;
    state.lastChar = q.char;
    state.awaitingNext = false;

    $('quizKana').textContent = q.char;
    $('quizScriptLabel').textContent = q.script === 'h' ? L().scriptHira : L().scriptKata;
    const input = $('quizInput');
    input.value = '';
    input.className = 'quiz-input';
    input.disabled = false;
    $('quizFeedback').textContent = '';
    $('quizFeedback').className = 'quiz-feedback';
    $('nextBtn').querySelector('span').textContent = L().check;
    updateProgress();
    setTimeout(() => input.focus(), 30);
  }

  function normalize(s) {
    return (s || '').trim().toLowerCase().replace(/[^a-z']/g, '');
  }
  function isCorrectAnswer(q, raw) {
    const v = normalize(raw);
    if (!v) return false;
    if (v === normalize(q.r)) return true;
    return (q.alt || []).some(a => normalize(a) === v);
  }

  function submitAnswer() {
    if (state.awaitingNext) { nextQuestion(); return; }
    const q = state.current;
    if (!q) return;
    const input = $('quizInput');
    const raw = input.value;
    if (!normalize(raw)) return; // ignore empty
    state.answered++;
    const ok = isCorrectAnswer(q, raw);
    if (state.ttsOn) playKanaTTS(q.char);
    // Maru / batsu reaction popup + sound, avoiding the quiz card.
    if (window.showReaction) {
      const busy = ['.site-header', '.quiz-card'].map(s => document.querySelector(s))
        .filter(Boolean).map(e => e.getBoundingClientRect());
      showReaction(ok ? 'correct' : 'wrong', busy);
    }
    if (ok) {
      state.correct++;
      state.streak++;
      input.classList.add('correct');
      $('quizFeedback').textContent = '◯ ' + L().correct;
      $('quizFeedback').className = 'quiz-feedback correct';
      if (state.mode === 'master') state.remaining.delete(q.char);
      updateStats(); updateProgress();
      // auto-advance quickly (a bit longer when audio is on so the
      // pronunciation has time to play)
      input.disabled = true;
      setTimeout(() => {
        if (state.finished) return;
        if (reachedEnd()) finishQuiz(); else nextQuestion();
      }, state.ttsOn ? 900 : 550);
    } else {
      state.wrong++;
      state.streak = 0;
      state.mistakes[q.char] = (state.mistakes[q.char] || 0) + 1;
      input.classList.add('wrong');
      $('quizFeedback').innerHTML = '✕ ' + L().wrong + ' — <span class="ans">' + L().answerWas(q.r) + '</span>';
      $('quizFeedback').className = 'quiz-feedback wrong';
      updateStats();
      // pause: require Enter / Next to continue so the user absorbs it
      state.awaitingNext = true;
      input.disabled = true;
      $('nextBtn').querySelector('span').textContent = L().next;
      setTimeout(() => $('nextBtn').focus(), 30);
    }
  }

  function reachedEnd() {
    if (state.mode === 'master') return state.remaining.size === 0;
    return state.correct >= state.count;
  }

  function updateStats() {
    $('statCorrect').textContent = state.correct;
    $('statWrong').textContent = state.wrong;
    $('statStreak').textContent = state.streak;
  }

  function updateProgress() {
    const Li = L();
    if (state.mode === 'master') {
      const total = state.pool.length;
      const done = total - state.remaining.size;
      $('progressText').textContent = Li.progMaster(done, total);
      $('progressFill').style.width = total ? (done / total * 100) + '%' : '0%';
    } else {
      const done = Math.min(state.correct, state.count);
      $('progressText').textContent = Li.progCount(done, state.count);
      $('progressFill').style.width = (done / state.count * 100) + '%';
    }
  }

  function finishQuiz() {
    state.finished = true;
    showView('viewResults');
    const Li = L();
    const acc = state.answered ? Math.round(state.correct / state.answered * 100) : 0;
    $('resultAccuracy').textContent = acc + '%';
    $('resTotal').textContent = state.answered;
    $('resCorrect').textContent = state.correct;
    const secs = Math.round((Date.now() - state.startTime) / 1000);
    $('resTime').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');

    const missed = Object.entries(state.mistakes).sort((a, b) => b[1] - a[1]);
    const box = $('reviewBox');
    const chips = $('reviewChips');
    chips.innerHTML = '';
    if (missed.length) {
      box.classList.remove('hidden');
      for (const [char, n] of missed) {
        const cell = CELL_BY_ID[char] || findCellByAnyChar(char);
        const r = cell ? cell.r : '';
        const chip = document.createElement('span');
        chip.className = 'review-chip';
        chip.innerHTML = `<span class="rc-kana">${char}</span> <span class="rj">${r}</span> <span class="rc-n">×${n}</span>`;
        chips.appendChild(chip);
      }
    } else {
      box.classList.add('hidden');
    }
  }

  function findCellByAnyChar(char) {
    for (const g of KANA_GROUPS) for (const row of g.rows) for (const c of row.cells)
      if (c.h === char || c.k === char) return c;
    return null;
  }

  /* ===========================================================
     View switching + i18n apply
     =========================================================== */
  function showView(id) {
    for (const v of ['viewSetup', 'viewQuiz', 'viewResults']) $(v).classList.toggle('hidden', v !== id);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function applyI18n() {
    const Li = L();
    $('setupTitle').textContent = Li.setupTitle;
    $('setupLead').textContent = Li.setupLead;
    $('presetAllL').textContent = Li.presetAll;
    $('presetNoneL').textContent = Li.presetNone;
    $('presetBasicL').textContent = Li.presetBasic;
    $('modeTitle').textContent = Li.modeTitle;
    $('modeMasterName').textContent = Li.modeMasterName;
    $('modeMasterDesc').textContent = Li.modeMasterDesc;
    $('modeCountName').textContent = Li.modeCountName;
    $('modeCountDesc').textContent = Li.modeCountDesc;
    $('startBtn').textContent = Li.start;
    $('quitL').textContent = Li.quit;
    $('catDakutenL').textContent = Li.groupDakuten;
    $('catComboL').textContent = Li.groupCombo;
    $('statCorrectL').textContent = Li.statCorrect;
    $('statWrongL').textContent = Li.statWrong;
    $('statStreakL').textContent = Li.statStreak;
    $('resultTitle').textContent = Li.resultTitle;
    $('resTotalL').textContent = Li.resTotal;
    $('resCorrectL').textContent = Li.resCorrect;
    $('resTimeL').textContent = Li.resTime;
    $('reviewTitle').textContent = Li.reviewTitle;
    $('againBtn').textContent = Li.again;
    $('backSetupBtn').textContent = Li.backSetup;
    $('quizInput').placeholder = Li.placeholder;
    // Buttons that depend on state
    const checkSpan = $('nextBtn').querySelector('span');
    if (checkSpan) checkSpan.textContent = state.awaitingNext ? Li.next : Li.check;
    updateTtsButton();
    refreshCounts();
    rebuildGridLabels();
  }

  // Rebuild grid so group/row labels follow language (kana chars don't change,
  // but group headers are localized).
  function rebuildGridLabels() {
    if (!$('viewSetup').classList.contains('hidden')) buildGrid();
  }

  /* ===========================================================
     Events
     =========================================================== */
  $('presetAll').addEventListener('click', presetAll);
  $('presetNone').addEventListener('click', presetNone);
  $('presetBasic').addEventListener('click', presetBasic);
  $('catDakuten').addEventListener('click', () => toggleGroupById('dakuten'));
  $('catCombo').addEventListener('click', () => toggleGroupById('combo'));
  $('modeMasterCard').addEventListener('click', () => setMode('master'));
  $('modeCountCard').addEventListener('click', () => setMode('count'));
  $('startBtn').addEventListener('click', startQuiz);

  $('nextBtn').addEventListener('click', submitAnswer);
  $('quizInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); }
  });
  $('ttsBtn').addEventListener('click', () => {
    state.ttsOn = !state.ttsOn;
    try { localStorage.setItem('kana_tts', state.ttsOn ? '1' : '0'); } catch (_) {}
    updateTtsButton();
  });
  $('quitBtn').addEventListener('click', () => { state.finished = true; showView('viewSetup'); });
  $('againBtn').addEventListener('click', startQuiz);
  $('backSetupBtn').addEventListener('click', () => showView('viewSetup'));

  /* ===========================================================
     Boot
     =========================================================== */
  // Default selection: all basic kana, both scripts.
  for (const r of KANA_GROUPS[0].rows) for (const c of r.cells) {
    state.selected.h.add(c.h);
    state.selected.k.add(c.h);
  }

  applySiteHeader('kana');
  setupLangToggle(() => { applySiteHeader('kana'); applyI18n(); });

  buildGrid();
  buildCountOptions();
  setMode('master');
  updateTtsButton();
  applyI18n();
  refreshCounts();
})();
</script>
</body>
</html>
