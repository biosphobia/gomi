# ============================================================
# Render Blueprint for the Osaka Support site
# ============================================================
#
# Render reads this file at deploy time and provisions a free
# static site. The site itself is plain HTML/CSS/JS, but the
# build step here regenerates `firebase-config.js` from the
# environment variables you set in the Render dashboard so the
# Firebase keys never live in git.
#
# DEPLOY STEPS (~5 minutes):
#   1. Push this file (and the rest of the site) to the branch
#      you want to deploy.
#   2. Go to https://dashboard.render.com and sign in.
#   3. Click "New +"  →  "Blueprint".
#   4. Connect GitHub if needed, select the repo `biosphobia/gomi`,
#      pick the branch (e.g. main, or this claude/* branch).
#   5. Render reads this file and shows a preview. Because every
#      env var below is declared `sync: false`, Render will prompt
#      you to enter values for them right there. Paste in:
#         FIREBASE_API_KEY            ← from Firebase web app config
#         FIREBASE_AUTH_DOMAIN        ← e.g. my-proj.firebaseapp.com
#         FIREBASE_PROJECT_ID         ← e.g. my-proj
#         FIREBASE_STORAGE_BUCKET     ← e.g. my-proj.appspot.com
#         FIREBASE_MESSAGING_SENDER_ID
#         FIREBASE_APP_ID
#         OSAKA_ADMIN_EMAIL           ← the email you registered as
#                                       the admin in Firebase Auth
#      Click Apply.
#   6. Render gives you a URL like https://osaka-support.onrender.com
#      (or a different name if that subdomain is taken).
#
# AFTER DEPLOY — wire Firebase to the new URL:
#   The Contact tab uses Firebase Auth, which only accepts sign-ins
#   from domains you've explicitly authorized:
#     Firebase Console > Authentication > Settings >
#         Authorized domains > Add domain
#     → paste the *.onrender.com host Render gave you.
#
# UPDATING ENV VARS LATER:
#   Render dashboard > your service > Environment tab. Edit and save;
#   Render redeploys automatically and the new values get written
#   into firebase-config.js by the build step.
#
# LOCAL DEV:
#   For testing on your own machine, fill in firebase-config.js by
#   hand. Don't commit those values. (Your push to a non-main branch
#   for testing is fine; just remember Render will overwrite the
#   file at build time using its env vars.)

services:
  - type: web
    name: osaka-support
    runtime: static
    # Generate firebase-config.js from env vars at build time, so the
    # keys never need to be checked into git.
    buildCommand: |
      cat > firebase-config.js <<EOF
      // Generated by Render at build time from environment variables.
      // To change these values, edit the env vars in the Render
      // dashboard, not this file.
      window.OSAKA_FIREBASE_CONFIG = {
        apiKey:            "${FIREBASE_API_KEY:-}",
        authDomain:        "${FIREBASE_AUTH_DOMAIN:-}",
        projectId:         "${FIREBASE_PROJECT_ID:-}",
        storageBucket:     "${FIREBASE_STORAGE_BUCKET:-}",
        messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID:-}",
        appId:             "${FIREBASE_APP_ID:-}"
      };
      window.OSAKA_ADMIN_EMAIL = "${OSAKA_ADMIN_EMAIL:-}";
      EOF
      echo "[build] firebase-config.js regenerated from env vars"
    staticPublishPath: .
    # Disabled because preview URLs would need to be added to Firebase
    # authorized domains too; turn on later if you want them.
    pullRequestPreviewsEnabled: false
    envVars:
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: OSAKA_ADMIN_EMAIL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
