# ============================================================
# Render Blueprint for the Osaka Support site
# ============================================================
#
# The Firebase keys are NOT stored in this repo at all. The site
# ships with @@PLACEHOLDER@@ tokens inside contact.html where the
# Firebase config would normally go. At deploy time, Render's
# buildCommand runs sed and replaces each token with the value of
# the matching environment variable from the Render dashboard.
# Empty/unset env vars are written as empty strings, which the
# Contact page detects and shows as ✗ on its setup screen.
#
# DEPLOY STEPS (~5 minutes):
#   1. Push this repo to GitHub.
#   2. https://dashboard.render.com → New + → Blueprint.
#   3. Connect GitHub, pick repo + branch.
#   4. Render reads this file and prompts for each `sync: false`
#      env var below. Paste them in:
#         FIREBASE_API_KEY             ← from Firebase web app config
#         FIREBASE_AUTH_DOMAIN         ← e.g. my-proj.firebaseapp.com
#         FIREBASE_PROJECT_ID          ← e.g. my-proj
#         FIREBASE_STORAGE_BUCKET      ← e.g. my-proj.appspot.com
#         FIREBASE_MESSAGING_SENDER_ID
#         FIREBASE_APP_ID
#         OSAKA_ADMIN_EMAIL            ← admin login email
#         GOOGLE_TRANSLATE_API_KEY     ← Google Cloud Translation v2
#                                        API key. Optional, but the
#                                        chat's Translate button only
#                                        works if it's set.
#      Click Apply.
#   5. Render gives you a https://*.onrender.com URL.
#
# AFTER DEPLOY:
#   Add the *.onrender.com host to:
#     Firebase Console > Authentication > Settings >
#         Authorized domains
#   so the Contact tab can sign visitors in on the deployed site.
#
# UPDATING ENV VARS LATER:
#   Render dashboard > your service > Environment tab > edit > save.
#   Render auto-redeploys and the build step re-substitutes the
#   tokens in contact.html with the new values.
#
# LOCAL DEV:
#   The placeholders stay as @@…@@ in your local checkout, and the
#   Contact page shows a setup screen listing what's missing. The
#   Game and Videos tabs work without any of this.

services:
  - type: web
    name: osaka-support
    runtime: static
    # In-place substitute every @@…@@ token in contact.html with
    # the matching env var. Empty values mean unset env vars and
    # produce empty strings, which contact.html treats as "not
    # configured" rather than crashing.
    buildCommand: |
      set -e
      echo "[build] Render shell: $0  |  bash version: $BASH_VERSION"
      echo "[build] env var status (masked):"
      for var in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID \
                 FIREBASE_STORAGE_BUCKET FIREBASE_MESSAGING_SENDER_ID \
                 FIREBASE_APP_ID OSAKA_ADMIN_EMAIL GOOGLE_TRANSLATE_API_KEY; do
        val="${!var}"
        if [ -z "$val" ]; then
          echo "  $var = <empty / unset>"
        else
          n=${#val}
          if [ "$n" -le 6 ]; then
            echo "  $var = ($n chars)"
          else
            echo "  $var = ${val:0:3}…${val: -3} ($n chars)"
          fi
        fi
      done
      sed -i \
        -e "s|@@FIREBASE_API_KEY@@|${FIREBASE_API_KEY:-}|g" \
        -e "s|@@FIREBASE_AUTH_DOMAIN@@|${FIREBASE_AUTH_DOMAIN:-}|g" \
        -e "s|@@FIREBASE_PROJECT_ID@@|${FIREBASE_PROJECT_ID:-}|g" \
        -e "s|@@FIREBASE_STORAGE_BUCKET@@|${FIREBASE_STORAGE_BUCKET:-}|g" \
        -e "s|@@FIREBASE_MESSAGING_SENDER_ID@@|${FIREBASE_MESSAGING_SENDER_ID:-}|g" \
        -e "s|@@FIREBASE_APP_ID@@|${FIREBASE_APP_ID:-}|g" \
        -e "s|@@OSAKA_ADMIN_EMAIL@@|${OSAKA_ADMIN_EMAIL:-}|g" \
        -e "s|@@GOOGLE_TRANSLATE_API_KEY@@|${GOOGLE_TRANSLATE_API_KEY:-}|g" \
        contact.html
      echo "[build] contact.html tokens substituted from env vars"
      remaining=$(grep -c '@@FIREBASE\|@@OSAKA\|@@GOOGLE' contact.html || true)
      if [ "$remaining" != "0" ]; then
        echo "[build] WARNING: $remaining placeholder(s) still present in contact.html"
        grep -n '@@FIREBASE\|@@OSAKA\|@@GOOGLE' contact.html || true
      fi
    staticPublishPath: .
    # Disabled because preview URLs would need to be re-added to
    # Firebase authorized domains; flip on later if you want them.
    pullRequestPreviewsEnabled: false
    envVars:
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: OSAKA_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
    headers:
      # contact.html now contains the live secrets after build, so
      # don't let CDN/browser caches hold a stale (or wrong-config)
      # version of it.
      - path: /contact.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
